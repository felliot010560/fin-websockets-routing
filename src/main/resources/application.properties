# Server Stuffs *

server.port: 8080
#security.require-ssl=true
#server.ssl.enabled = true
#server.ssl.key-store:/etc/letsencrypt/live/condors.aleatorysw.com/keystore.p12
#server.ssl.key-store-password: ${CONDORS_KEYSTORE_PW}
#server.ssl.keyStoreType: PKCS12
#server.ssl.keyAlias: tomcat

server.servlet.session.timeout=540m

# DB Stuffs #
spring.datasource.url=jdbc:postgresql://localhost:5432/condors
spring.datasource.username=${CONDORS_DB_USER}
spring.datasource.password=${CONDORS_DB_PW}
spring.datasource.hikari.maximum-pool-size=10

app.security.username=${CONDORS_APP_USERNAME:#{null}}
app.security.password=${CONDORS_APP_PASSWORD:#{null}}

pricing.websockets.url=ws://localhost:8081/pricing
trading.websockets.url=ws://localhost:8082/trading
portfolio.websockets.url=ws://localhost:8083/portfolio
trading.rest.url=http://localhost:8082
portfolio.rest.url=http://localhost:8083

# Redis Stuffs #
spring.redis.port=6379
spring.redis.password=${REDIS_PW}
spring.redis.host=localhost

backend.messaging.transport=redis